<svg xmlns="http://www.w3.org/2000/svg" width="440" height="384" viewBox="0 0 440 384" font-family="Segoe UI, -apple-system, system-ui, sans-serif">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6B6FD8"/>
      <stop offset="1" stop-color="#4F52B2"/>
    </linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13A10E"/>
      <stop offset="0.55" stop-color="#7BD327"/>
      <stop offset="0.85" stop-color="#F7630C"/>
      <stop offset="1" stop-color="#C50F1F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- window background -->
  <rect width="440" height="384" fill="#F5F5F5"/>

  <!-- header -->
  <rect x="24" y="24" width="44" height="44" rx="12" fill="url(#badge)"/>
  <text x="46" y="53" font-size="22" text-anchor="middle">🎤</text>
  <text x="80" y="42" font-size="18" font-weight="600" fill="#242424">Mic Check</text>
  <text x="80" y="61" font-size="12.5" fill="#616161">Confirm you're being heard — before you ask.</text>

  <!-- card -->
  <rect x="24" y="88" width="392" height="196" rx="10" fill="#FFFFFF" stroke="#E0E0E0" filter="url(#shadow)"/>

  <!-- verdict banner: good -->
  <rect x="40" y="104" width="360" height="44" rx="8" fill="#E7F5E6"/>
  <circle cx="60" cy="126" r="6" fill="#13A10E"/>
  <circle cx="60" cy="126" r="10" fill="#13A10E" opacity="0.22"/>
  <text x="78" y="131" font-size="15" font-weight="600" fill="#0E7A0A">You're being heard 👍</text>

  <!-- meter -->
  <rect x="40" y="166" width="360" height="20" rx="10" fill="#EEF0F4" stroke="#E0E0E0"/>
  <clipPath id="clipMeter"><rect x="40" y="166" width="360" height="20" rx="10"/></clipPath>
  <rect x="40" y="166" width="224" height="20" fill="url(#meter)" clip-path="url(#clipMeter)"/>
  <rect x="104" y="163" width="2" height="26" fill="#616161" opacity="0.5"/>

  <!-- scale -->
  <text x="40" y="204" font-size="11" fill="#616161">quiet</text>
  <text x="220" y="204" font-size="11" fill="#616161" text-anchor="middle">good</text>
  <text x="400" y="204" font-size="11" fill="#616161" text-anchor="end">loud</text>

  <!-- teams signal -->
  <circle cx="44" cy="224" r="4" fill="#13A10E"/>
  <text x="54" y="228" font-size="12.5" fill="#616161">Teams confirms you're speaking — you're live.</text>

  <!-- actions -->
  <rect x="40" y="244" width="66" height="30" rx="8" fill="none" stroke="#E0E0E0"/>
  <text x="73" y="263" font-size="13" font-weight="600" fill="#242424" text-anchor="middle">Done</text>
  <text x="400" y="263" font-size="11.5" fill="#616161" text-anchor="end">🎙 Default microphone</text>

  <!-- footer -->
  <text x="24" y="320" font-size="12" fill="#616161">Listening — say something like you normally would.</text>
  <text x="24" y="342" font-size="11.5" fill="#616161">🔒 Audio is analyzed locally in this panel. Never recorded, never uploaded.</text>
</svg>
